name: Build installable APK (FOSS debug)
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      # FOSS build: no Sentry/Last.fm secrets and no Google Cast, so nothing here needs a secret.
      - name: Generate aboutLibraries.json
        run: ./gradlew -PisFullBuild=false exportLibraryDefinitions

      # Debug builds are signed with the SDK's debug key automatically and use the ".dev"
      # application id, so this installs alongside an official SimpMusic instead of replacing it.
      - name: Build debug APK
        run: ./gradlew -PisFullBuild=false androidApp:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-apk
          path: androidApp/build/outputs/apk/debug/*.apk
