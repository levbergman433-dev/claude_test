name: Build installable APK (FOSS release)
on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SECRET: ${{ secrets.SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      # FOSS build: no Sentry/Last.fm secrets and no Google Cast, so nothing here needs a secret.
      - name: Generate aboutLibraries.json
        run: ./gradlew -PisFullBuild=false exportLibraryDefinitions

      # Release = R8-optimised and without debug overhead, i.e. the build that actually feels
      # smooth. The ".mod" id suffix lets it sit beside an official SimpMusic.
      - name: Build release APKs
        run: ./gradlew -PisFullBuild=false -PreleaseIdSuffix=.mod androidApp:assembleRelease

      # Signing key: the SIGNING_KEY secret (base64 keystore) + KEY_PASSWORD when set. Without
      # them, a key is generated once and kept in the Actions cache so that every build carries the
      # SAME signature and installs as an update over the previous one. Caches expire after a week
      # without builds, so adding the secrets is what makes the key permanent.
      - name: Restore fallback signing key
        if: ${{ env.HAS_SECRET != 'true' }}
        id: keycache
        uses: actions/cache@v4
        with:
          path: sideload.jks
          key: sideload-signing-key-v1

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > signing.jks
            echo "KS_PASS=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::SIGNING_KEY secret not set; using the cached fallback key"
            if [ ! -f sideload.jks ]; then
              # The cached key is gone (evicted or expired): this build cannot install as an update
              # over any earlier one. Say so on the run page rather than leave it to the installer.
              echo "::error title=New signing key generated::The cached signing key was missing, so a new one was made. This APK will NOT install over builds signed with the old key: uninstall first (Settings > Backup to keep your data). Add the SIGNING_KEY and KEY_PASSWORD secrets to stop this happening again."
              keytool -genkeypair -v -keystore sideload.jks -alias simpmusic -keyalg RSA -keysize 4096 \
                -validity 36500 -storepass sideload-key -keypass sideload-key \
                -dname "CN=SimpMusic sideload"
            fi
            cp sideload.jks signing.jks
            echo "KS_PASS=sideload-key" >> "$GITHUB_ENV"
          fi

      - name: Sign APKs
        run: |
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          mkdir -p signed
          for apk in androidApp/build/outputs/apk/release/*-unsigned.apk; do
            name=$(basename "$apk" -release-unsigned.apk)
            name=${name#androidApp-}
            case "$name" in *arm64-v8a*|*universal*) ;; *) continue ;; esac
            "$BT/zipalign" -f -p 4 "$apk" aligned.apk
            "$BT/apksigner" sign --ks signing.jks --ks-key-alias simpmusic \
              --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
              --out "signed/Tunes-$name.apk" aligned.apk
          done
          rm -f signing.jks aligned.apk
          ls -la signed

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tunes-apk
          path: signed/*.apk

  # Installs the APK on an emulator and walks Home → Library → a song → Now Playing in three Now
  # Playing setups (scripts/ci/ui-smoke.sh). Screenshots and frame statistics are posted as check
  # runs on the commit ("ui-shot: …", "ui-stats"). The emulator renders in software, so its frame
  # times are for comparing builds with each other, not for judging one on its own.
  ui-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: Tunes-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Pillow
        run: python3 -m pip install --user --break-system-packages pillow || sudo apt-get install -y python3-pil

      - name: Run UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: false
          script: bash scripts/ci/ui-smoke.sh apk/Tunes-universal.apk
