// Classes the Compose compiler should treat as stable, so a composable taking one of them can skip
// recomposing when it receives an equal value, instead of only when it receives the same instance.
//
// Safe for these because they are only ever replaced, never mutated in place after reaching the UI:
// every flow that carries them emits a new object on change. Marking a class stable changes the
// skip check from `===` to `equals()`, and generated data-class equals() starts with `===`, so the
// common case costs nothing extra.

// Domain models and entities (songs, tracks, albums, playlists, home rows, ...).
com.maxrave.domain.data.**

// Read-only collection interfaces. The app never hands a list to the UI and then mutates it.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set

// Time values used on playlist and analytics rows.
kotlinx.datetime.LocalDateTime
kotlinx.datetime.LocalDate
